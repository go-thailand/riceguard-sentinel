name: Deploy Prod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-sentinel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - name: Deploy to prod host
        run: rsync -az --delete dist/ ec2-user@${{ secrets.PROD_HOST }}:/var/www/sentinel-prod/
      - name: Health gate
        run: |
          sleep 2
          curl -fsS --max-time 15 https://riceguardsentinel.com/ | grep -q '<title>' \
            || { echo "::error::Health gate FAILED"; exit 1; }
          echo "Health gate OK"
